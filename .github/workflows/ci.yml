name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow never writes to the repository (no gh/git
# write commands, no GITHUB_TOKEN write usage) — read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  linux-primary:
    name: Linux primary device (Debian 13)
    runs-on: ubuntu-latest
    container: node:24-trixie
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Debian build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg systemd
          rm -rf /var/lib/apt/lists/*

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          node --version
          pnpm --version

      - name: Require checked-in pnpm lockfile
        run: |
          test -f pnpm-lock.yaml || {
            echo '::error::pnpm-lock.yaml is missing. CI will not mutate the branch to repair repository state.'
            exit 1
          }

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Linux client typecheck
        run: pnpm --filter @irp/linux-client typecheck

      - name: Linux client lint
        run: pnpm --filter @irp/linux-client lint

      - name: Linux client tests
        run: pnpm --filter @irp/linux-client test

      - name: Linux client build
        run: pnpm --filter @irp/linux-client build

      - name: Verify systemd unit contract
        run: |
          node_bin="$(command -v node)"
          test -n "$node_bin"
          if [ "$node_bin" != "/usr/bin/node" ]; then
            ln -sf "$node_bin" /usr/bin/node
          fi
          test -x /usr/bin/node
          if ! getent group irp >/dev/null 2>&1; then
            groupadd --system irp
          fi
          if ! getent passwd irp >/dev/null 2>&1; then
            useradd --system --gid irp --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin irp
          fi
          systemd-analyze verify packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'User=irp' packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'Group=irp' packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'NoNewPrivileges=true' packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'ProtectSystem=strict' packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'dist/main.js' packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'WorkingDirectory=/usr/lib/irp/linux-client' packages/linux-client/systemd/irp-linux-client.service

      - name: Build Debian package
        run: |
          bash scripts/build-linux-deb.sh
          test -s dist/linux/irp-linux-client_0.1.1_amd64.deb
          test -s dist/linux/irp-linux-client_0.1.1_amd64.deb.sha256

      - name: Verify Debian package metadata and contents
        run: |
          set -euo pipefail
          package="dist/linux/irp-linux-client_0.1.1_amd64.deb"
          contents="$(mktemp)"
          trap 'rm -f "$contents"' EXIT
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" > "$contents"
          grep -Fq './usr/lib/irp/linux-client/dist/index.js' "$contents"
          grep -Fq './usr/lib/irp/linux-client/dist/main.js' "$contents"
          grep -Fq './usr/lib/systemd/system/irp-linux-client.service' "$contents"
          sha256sum -c dist/linux/irp-linux-client_0.1.1_amd64.deb.sha256

      - name: Smoke test packaged Linux client
        run: |
          rm -rf /tmp/irp-linux-package
          mkdir -p /tmp/irp-linux-package
          dpkg-deb --extract dist/linux/irp-linux-client_0.1.1_amd64.deb /tmp/irp-linux-package
          node --check /tmp/irp-linux-package/usr/lib/irp/linux-client/dist/index.js
          node --check /tmp/irp-linux-package/usr/lib/irp/linux-client/dist/main.js
          test -f /tmp/irp-linux-package/usr/lib/systemd/system/irp-linux-client.service

  architecture:
    name: Architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Require checked-in pnpm lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Enforce IRP architecture contract
        run: pnpm architecture:check

      - name: Test architecture enforcement
        run: pnpm architecture:test
  validate:
    name: Validate repository
    needs: [linux-primary, architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: irp_smoke_postgres_password
      JWT_SECRET: irp_smoke_jwt_secret_012345678901234567890123456789
      REMOTE_CLIENT_CREDENTIAL_KEY: irp_smoke_credential_key_012345678901234567890123
      REMOTE_CLIENT_REFRESH_KEY: irp_smoke_refresh_key_012345678901234567890123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: Require checked-in pnpm lockfile
        run: |
          test -f pnpm-lock.yaml || {
            echo '::error::pnpm-lockfile is missing.'
            echo 'Generate it with pnpm install --lockfile-only and commit the resulting lockfile before enabling frozen installs.'
            exit 1
          }

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate repository integrity
        run: pnpm validate

      - name: Enforce IRP architecture contract
        run: pnpm architecture:check

      - name: Test architecture enforcement
        run: pnpm architecture:test

      - name: Validate documentation integrity
        run: pnpm validate:docs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test production certification and system assurance report checksums
        run: pnpm certification:test

      - name: Fresh coverage
        run: pnpm exec turbo run test --force -- --coverage

      - name: Build
        run: pnpm build

      - name: Smoke test deterministic examples
        run: pnpm examples:smoke

      - name: Run production Docker runtime smoke test
        run: bash scripts/docker-smoke.sh

      - name: Show Docker Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Remove Docker Compose runtime
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Create trusted source artifact
        if: github.ref == 'refs/heads/main'
        run: git archive --format=tar.gz --output="${RUNNER_TEMP}/irp-source.tar.gz" "${GITHUB_SHA}"

      - name: Upload trusted source artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: irp-source-${{ github.sha }}
          path: ${{ runner.temp }}/irp-source.tar.gz
          if-no-files-found: error
          retention-days: 7

  bootstrap-durable-repositories:
    name: Bootstrap durable API wiring
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply durable repository boundary
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/index.ts')
          text = path.read_text()
          if 'createDurableRepositories' in text:
              raise SystemExit(0)
          anchor = "import { injectAnalyticsIntoHtml, defaultAnalyticsConfig, trackServerEvent } from './analytics.js';\n"
          text = text.replace(anchor, anchor + "import { createDurableRepositories } from './durable-repositories.js';\n")
          start = text.index('class Store<T extends Entity> {')
          end = text.index('const isProductionRuntime = () =>', start)
          text = text[:start] + text[end:]
          db_anchor = "  const db = createPrismaClient(process.env.DATABASE_URL);\n"
          text = text.replace(db_anchor, db_anchor + "  const repositories = createDurableRepositories(db);\n  const { users, organizations: orgs, projects, workspaces, sessions } = repositories;\n")
          auth_start = text.index("  const authRateLimit = rateLimitPreHandler")
          auth_end = text.index("  app.addHook('onClose'", auth_start)
          replacement = r'''  const authRateLimit = rateLimitPreHandler(new InMemoryRateLimiter({ max: 10, windowMs: 60_000 }));
  app.post('/api/v1/auth/register', { preHandler: authRateLimit }, async (request, reply) => {
    const input = registerSchema.parse(request.body);
    if (await users.findByEmail(input.email)) throw new ConflictAppError('Email is already registered.');
    const isAdmin = isBootstrapAdminEmail(input.email);
    const user = { ...(await users.create({ id: crypto.randomUUID(), email: input.email, name: input.name, passwordHash: hashPassword(input.password), status: 'active', createdAt: now(), updatedAt: now() })), roles: isAdmin ? ['platform_admin'] : ['member'], permissions: isAdmin ? permissions : [] };
    await events.publish(createDomainEvent('user.registered', user.id, { email: user.email }));
    await trackServerEvent('user_registered', { status: user.status });
    return reply.code(201).send(created(publicUser(user) as never));
  });
  app.post('/api/v1/auth/login', { preHandler: authRateLimit }, async (request) => {
    const input = loginSchema.parse(request.body);
    const record = await users.findByEmail(input.email);
    const user = record ? { ...record, roles: isBootstrapAdminEmail(record.email) ? ['platform_admin'] : ['member'], permissions: isBootstrapAdminEmail(record.email) ? permissions : [] } : null;
    if (!user || user.status !== 'active' || !verifyPassword(input.password, user.passwordHash)) throw new UnauthorizedAppError('Invalid credentials');
    const sessionId = crypto.randomUUID();
    const expiresAt = new Date(Date.now() + 30 * 86400_000).toISOString();
    const accessToken = jwt.sign({ sub: user.id, roles: user.roles, scopes: user.permissions, sessionId, type: 'access', ttlSeconds: 900 });
    const refreshToken = jwt.sign({ sub: user.id, roles: user.roles, scopes: user.permissions, sessionId, type: 'refresh', ttlSeconds: 30 * 86400 });
    await sessions.create({ id: sessionId, userId: user.id, refreshToken, expiresAt });
    await trackServerEvent('user_login', { method: 'password' });
    return ok({ accessToken, refreshToken, expiresIn: 900, user: publicUser(user) });
  });
  app.post('/api/v1/auth/refresh', { preHandler: authRateLimit }, async (request) => {
    const token = z.object({ refreshToken: z.string() }).parse(request.body).refreshToken;
    const claims = jwt.verify(token, 'refresh');
    const record = await users.get(claims.sub);
    const user = record ? { ...record, roles: isBootstrapAdminEmail(record.email) ? ['platform_admin'] : ['member'], permissions: isBootstrapAdminEmail(record.email) ? permissions : [] } : null;
    const session = claims.sessionId ? await sessions.get(claims.sessionId) : null;
    const sessionExpired = session ? Date.now() >= Date.parse(session.expiresAt) : true;
    if (!user || user.status !== 'active' || !session || session.revokedAt || sessionExpired || !(await sessions.matchesRefreshToken(session, token))) throw new UnauthorizedAppError();
    await sessions.revoke(session.id);
    const rotatedId = crypto.randomUUID();
    const rotatedExpiresAt = new Date(Date.now() + 30 * 86400_000).toISOString();
    const rotatedAccessToken = jwt.sign({ sub: user.id, roles: user.roles, scopes: user.permissions, sessionId: rotatedId, type: 'access', ttlSeconds: 900 });
    const rotatedRefreshToken = jwt.sign({ sub: user.id, roles: user.roles, scopes: user.permissions, sessionId: rotatedId, type: 'refresh', ttlSeconds: 30 * 86400 });
    await sessions.create({ id: rotatedId, userId: user.id, refreshToken: rotatedRefreshToken, expiresAt: rotatedExpiresAt });
    return ok({ accessToken: rotatedAccessToken, refreshToken: rotatedRefreshToken, expiresIn: 900 });
  });
  app.post('/api/v1/auth/logout', { preHandler: generalRateLimit }, async (request) => { const p = await requireAuth(request); const sid = String(p.metadata?.sessionId ?? ''); if (sid) await sessions.revoke(sid); return ok({ loggedOut: true }); });
  app.post('/api/v1/auth/password-reset/request', { preHandler: generalRateLimit }, async (request) => { z.object({ email: z.string().email() }).parse(request.body); return ok({ accepted: true }); });
  app.post('/api/v1/auth/email-verification/request', { preHandler: generalRateLimit }, async (request) => { await requireAuth(request); return ok({ accepted: true }); });
  const listUsers = async (request: FastifyRequest) => { await requirePermission(request, 'users:read'); const q = paginationSchema.parse(request.query); const result = await users.list(q, q.search); return ok(result.items.map((record) => publicUser({ ...record, roles: isBootstrapAdminEmail(record.email) ? ['platform_admin'] : ['member'], permissions: isBootstrapAdminEmail(record.email) ? permissions : [] })), { total: result.total, page: result.page, pageSize: result.pageSize }); };
  app.get('/api/v1/users', listUsers);
  app.get('/api/v1/users/:id', { preHandler: generalRateLimit }, async (request) => { await requirePermission(request, 'users:read'); const record = await users.get(idParams.parse(request.params).id); if (!record) throw new NotFoundAppError('user'); return ok(publicUser({ ...record, roles: isBootstrapAdminEmail(record.email) ? ['platform_admin'] : ['member'], permissions: isBootstrapAdminEmail(record.email) ? permissions : [] })); });
  app.get('/api/v1/me', { preHandler: generalRateLimit }, async (request) => { const p = await requireAuth(request); const record = await users.get(p.id); if (!record) throw new NotFoundAppError('user'); return ok(publicUser({ ...record, roles: isBootstrapAdminEmail(record.email) ? ['platform_admin'] : ['member'], permissions: isBootstrapAdminEmail(record.email) ? permissions : [] })); });
  app.get('/api/v1/organizations', { preHandler: generalRateLimit }, async (request) => { await requirePermission(request, 'organizations:read'); const q = paginationSchema.parse(request.query); const r = await orgs.list(q, q.search); return ok(r.items, { total: r.total, page: r.page, pageSize: r.pageSize }); });
  app.post('/api/v1/organizations', { preHandler: generalRateLimit }, async (request, reply) => { await requirePermission(request, 'organizations:write'); const i = nameSchema.parse(request.body); const slug = i.slug ?? slugify(i.name); if (await orgs.findBySlug(slug)) throw new ConflictAppError('Organization slug already exists.'); return reply.code(201).send(created(await orgs.create({ id: crypto.randomUUID(), name: i.name, slug, createdAt: now(), updatedAt: now() }))); });
  app.get('/api/v1/organizations/:id', { preHandler: generalRateLimit }, async (request) => { await requirePermission(request, 'organizations:read'); const o = await orgs.get(idParams.parse(request.params).id); if (!o) throw new NotFoundAppError('organization'); return ok(o); });
  app.delete('/api/v1/organizations/:id', { preHandler: generalRateLimit }, async (request) => { await requirePermission(request, 'organizations:write'); const id = idParams.parse(request.params).id; if (!(await orgs.get(id))) throw new NotFoundAppError('organization'); await orgs.softDelete(id); return ok({ deleted: true }); });
  app.get('/api/v1/projects', { preHandler: generalRateLimit }, async (request) => { await requirePermission(request, 'projects:read'); const q = paginationSchema.parse(request.query); const r = await projects.list(q); return ok(r.items, { total: r.total, page: r.page, pageSize: r.pageSize }); });
  app.post('/api/v1/organizations/:id/projects', { preHandler: generalRateLimit }, async (request, reply) => { await requirePermission(request, 'projects:write'); const organizationId = idParams.parse(request.params).id; if (!(await orgs.get(organizationId))) throw new NotFoundAppError('organization'); const i = nameSchema.parse(request.body); const slug = i.slug ?? slugify(i.name); return reply.code(201).send(created(await projects.create({ id: crypto.randomUUID(), organizationId, name: i.name, slug, ...(i.description ? { description: i.description } : {}), createdAt: now(), updatedAt: now() }))); });
  app.get('/api/v1/projects/:id', { preHandler: generalRateLimit }, async (request) => { await requirePermission(request, 'projects:read'); const p = await projects.get(idParams.parse(request.params).id); if (!p) throw new NotFoundAppError('project'); return ok(p); });
  app.get('/api/v1/workspaces', { preHandler: generalRateLimit }, async (request) => { await requirePermission(request, 'workspaces:read'); const q = paginationSchema.parse(request.query); const r = await workspaces.list(q); return ok(r.items, { total: r.total, page: r.page, pageSize: r.pageSize }); });
  app.post('/api/v1/organizations/:id/workspaces', { preHandler: generalRateLimit }, async (request, reply) => { await requirePermission(request, 'workspaces:write'); const organizationId = idParams.parse(request.params).id; if (!(await orgs.get(organizationId))) throw new NotFoundAppError('organization'); const i = workspaceSchema.parse(request.body); if (i.projectId && !(await projects.get(i.projectId))) throw new NotFoundAppError('project'); const slug = i.slug ?? slugify(i.name); return reply.code(201).send(created(await workspaces.create({ id: crypto.randomUUID(), organizationId, ...(i.projectId ? { projectId: i.projectId } : {}), name: i.name, slug, environment: i.environment, createdAt: now(), updatedAt: now() }))); });
  const workspaceReadRateLimit = rateLimitPreHandler(new InMemoryRateLimiter({ max: 120, windowMs: 60_000 }), (request) => `${request.ip}:workspace-read`);
  app.get('/api/v1/workspaces/:id', { preHandler: workspaceReadRateLimit }, async (request) => { await requirePermission(request, 'workspaces:read'); const w = await workspaces.get(idParams.parse(request.params).id); if (!w) throw new NotFoundAppError('workspace'); return ok(w); });
'''
          text = text[:auth_start] + replacement + text[auth_end:]
          path.write_text(text)
          PY
      - name: Commit durable wiring
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(api): wire durable postgres repositories'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
